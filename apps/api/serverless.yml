service: hunch

frameworkVersion: "^4"

# Keep serverless-esbuild. Serverless 4's built-in esbuild conflicts with that plugin.
build:
  esbuild: false

provider:
  name: aws
  runtime: nodejs20.x
  # Region and stage confirmed during T04 manual preparation.
  # This project account is locked to Stockholm. See D6 in docs/architecture.md.
  # Use: serverless deploy --stage dev --region eu-north-1
  region: ${opt:region, 'eu-north-1'}
  stage: ${opt:stage, 'dev'}
  memorySize: 256
  timeout: 10
  logRetentionInDays: 14
  tags:
    project: hunch
    stage: ${self:provider.stage}
  # Health has no DynamoDB statements. Serverless still grants CloudWatch logs.
  # Player functions use PlayerLambdaRole. Passing amplifyOrigin on every deploy
  # keeps the hosted site allowed. Omitting it falls back to localhost.
  environment:
    TABLE_NAME: hunch-${sls:stage}
  httpApi:
    cors:
      allowedOrigins:
        - http://localhost:5173
        - ${param:amplifyOrigin, 'http://localhost:5173'}
      allowedHeaders:
        - Content-Type
        - Authorization
      allowedMethods:
        - GET
        - POST
      maxAge: 600

plugins:
  - serverless-esbuild

custom:
  esbuild:
    bundle: true
    minify: false
    sourcemap: true
    target: node20
    platform: node
    exclude:
      - '@aws-sdk/*'

functions:
  health:
    handler: src/handlers/health.handler
    description: Basic connectivity check
    events:
      - httpApi:
          path: /health
          method: GET
  createPlayer:
    handler: src/handlers/createPlayer.handler
    description: Create an anonymous player and return the raw token once
    role:
      Fn::GetAtt: [PlayerLambdaRole, Arn]
    events:
      - httpApi:
          path: /players
          method: POST
  me:
    handler: src/handlers/me.handler
    description: Restore the authenticated player's score
    role:
      Fn::GetAtt: [PlayerLambdaRole, Arn]
    events:
      - httpApi:
          path: /me
          method: GET
  market:
    handler: src/handlers/market.handler
    description: Public display quote for BTC-USD
    events:
      - httpApi:
          path: /market
          method: GET
  createPrediction:
    handler: src/handlers/createPrediction.handler
    description: Record one pending prediction for the authenticated player
    role:
      Fn::GetAtt: [PredictionLambdaRole, Arn]
    environment:
      STATE_MACHINE_ARN: arn:aws:states:${aws:region}:${aws:accountId}:stateMachine:hunch-${sls:stage}-resolution
    events:
      - httpApi:
          path: /predictions
          method: POST
  resolvePrediction:
    handler: src/handlers/resolvePrediction.handler
    description: Settle one prediction after its deadline
    timeout: 15
    role:
      Fn::GetAtt: [ResolverLambdaRole, Arn]
  recoverStuckPredictions:
    handler: src/handlers/recoverStuckPredictions.handler
    description: Restart a resolution workflow that never started or stopped
    timeout: 30
    role:
      Fn::GetAtt: [RecoveryLambdaRole, Arn]
    environment:
      STATE_MACHINE_ARN: arn:aws:states:${aws:region}:${aws:accountId}:stateMachine:hunch-${sls:stage}-resolution
    events:
      - schedule: rate(5 minutes)

resources:
  Conditions:
    HasAlarmEmail:
      Fn::Not:
        - Fn::Equals:
            - ${param:alarmEmail, ''}
            - ''
  Resources:
    GameTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Retain
      Properties:
        TableName: hunch-${sls:stage}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: pk
            AttributeType: S
          - AttributeName: sk
            AttributeType: S
          - AttributeName: pendingKey
            AttributeType: S
          - AttributeName: pendingDueAt
            AttributeType: S
        KeySchema:
          - AttributeName: pk
            KeyType: HASH
          - AttributeName: sk
            KeyType: RANGE
        TimeToLiveSpecification:
          AttributeName: expiresAt
          Enabled: true
        GlobalSecondaryIndexes:
          - IndexName: pending-by-due
            KeySchema:
              - AttributeName: pendingKey
                KeyType: HASH
              - AttributeName: pendingDueAt
                KeyType: RANGE
            Projection:
              ProjectionType: KEYS_ONLY
        Tags:
          - Key: project
            Value: hunch
          - Key: stage
            Value: ${sls:stage}
    PlayerLambdaRole:
      Type: AWS::IAM::Role
      Properties:
        RoleName: hunch-${sls:stage}-players
        AssumeRolePolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal:
                Service: lambda.amazonaws.com
              Action: sts:AssumeRole
        Policies:
          - PolicyName: player-table
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - dynamodb:GetItem
                    - dynamodb:PutItem
                  Resource:
                    Fn::GetAtt: [GameTable, Arn]
                - Effect: Allow
                  Action:
                    - logs:CreateLogStream
                    - logs:CreateLogGroup
                    - logs:TagResource
                  Resource:
                    Fn::Sub: arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/hunch-${sls:stage}-*:*
                - Effect: Allow
                  Action:
                    - logs:PutLogEvents
                  Resource:
                    Fn::Sub: arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/hunch-${sls:stage}-*:*:*
    PredictionLambdaRole:
      Type: AWS::IAM::Role
      Properties:
        RoleName: hunch-${sls:stage}-predictions
        AssumeRolePolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal:
                Service: lambda.amazonaws.com
              Action: sts:AssumeRole
        Policies:
          - PolicyName: prediction-table
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - dynamodb:GetItem
                    - dynamodb:PutItem
                    - dynamodb:UpdateItem
                    - dynamodb:TransactWriteItems
                  Resource:
                    Fn::GetAtt: [GameTable, Arn]
                - Effect: Allow
                  Action:
                    - logs:CreateLogStream
                    - logs:CreateLogGroup
                    - logs:TagResource
                  Resource:
                    Fn::Sub: arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/hunch-${sls:stage}-*:*
                - Effect: Allow
                  Action:
                    - logs:PutLogEvents
                  Resource:
                    Fn::Sub: arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/hunch-${sls:stage}-*:*:*
                - Effect: Allow
                  Action:
                    - states:StartExecution
                  Resource:
                    Fn::Sub: arn:aws:states:${AWS::Region}:${AWS::AccountId}:stateMachine:hunch-${sls:stage}-resolution
    ResolverLambdaRole:
      Type: AWS::IAM::Role
      Properties:
        RoleName: hunch-${sls:stage}-resolver
        AssumeRolePolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal:
                Service: lambda.amazonaws.com
              Action: sts:AssumeRole
        Policies:
          - PolicyName: resolver-table
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - dynamodb:GetItem
                    - dynamodb:UpdateItem
                    - dynamodb:TransactWriteItems
                  Resource:
                    Fn::GetAtt: [GameTable, Arn]
                - Effect: Allow
                  Action:
                    - logs:CreateLogStream
                    - logs:CreateLogGroup
                    - logs:TagResource
                  Resource:
                    Fn::Sub: arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/hunch-${sls:stage}-*:*
                - Effect: Allow
                  Action:
                    - logs:PutLogEvents
                  Resource:
                    Fn::Sub: arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/hunch-${sls:stage}-*:*:*
    RecoveryLambdaRole:
      Type: AWS::IAM::Role
      Properties:
        RoleName: hunch-${sls:stage}-recovery
        AssumeRolePolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal:
                Service: lambda.amazonaws.com
              Action: sts:AssumeRole
        Policies:
          - PolicyName: recovery-index
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - dynamodb:Query
                  Resource:
                    Fn::Join:
                      - ''
                      - - Fn::GetAtt:
                            - GameTable
                            - Arn
                        - /index/pending-by-due
                - Effect: Allow
                  Action:
                    - states:StartExecution
                  Resource:
                    Fn::Sub: arn:aws:states:${AWS::Region}:${AWS::AccountId}:stateMachine:hunch-${sls:stage}-resolution
                - Effect: Allow
                  Action:
                    - states:DescribeExecution
                  Resource:
                    Fn::Sub: arn:aws:states:${AWS::Region}:${AWS::AccountId}:execution:hunch-${sls:stage}-resolution:*
                - Effect: Allow
                  Action:
                    - logs:CreateLogStream
                    - logs:CreateLogGroup
                    - logs:TagResource
                  Resource:
                    Fn::Sub: arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/hunch-${sls:stage}-*:*
                - Effect: Allow
                  Action:
                    - logs:PutLogEvents
                  Resource:
                    Fn::Sub: arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/hunch-${sls:stage}-*:*:*
    ResolutionStateMachineRole:
      Type: AWS::IAM::Role
      Properties:
        RoleName: hunch-${sls:stage}-resolution
        AssumeRolePolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal:
                Service: states.amazonaws.com
              Action: sts:AssumeRole
        Policies:
          - PolicyName: invoke-resolver
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - lambda:InvokeFunction
                  Resource:
                    Fn::GetAtt: [ResolvePredictionLambdaFunction, Arn]
    ResolutionStateMachine:
      Type: AWS::StepFunctions::StateMachine
      Properties:
        StateMachineName: hunch-${sls:stage}-resolution
        RoleArn:
          Fn::GetAtt: [ResolutionStateMachineRole, Arn]
        DefinitionString:
          Fn::Join:
            - Fn::GetAtt: [ResolvePredictionLambdaFunction, Arn]
            - Fn::Split:
                - RESOLVE_FUNCTION_ARN
                - ${file(src/workflow/resolution.asl)}
    AlertTopic:
      Type: AWS::SNS::Topic
      Properties:
        TopicName: hunch-${sls:stage}-alerts
    AlertEmailSubscription:
      Type: AWS::SNS::Subscription
      Condition: HasAlarmEmail
      Properties:
        Protocol: email
        TopicArn:
          Ref: AlertTopic
        Endpoint: ${param:alarmEmail, ''}
    ResolutionFailedAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: hunch-${sls:stage}-resolution-failed
        Namespace: AWS/States
        MetricName: ExecutionsFailed
        Dimensions:
          - Name: StateMachineArn
            Value:
              Ref: ResolutionStateMachine
        Statistic: Sum
        Period: 300
        EvaluationPeriods: 1
        Threshold: 1
        ComparisonOperator: GreaterThanOrEqualToThreshold
        TreatMissingData: notBreaching
        AlarmActions:
          - Ref: AlertTopic
    ResolutionTimedOutAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: hunch-${sls:stage}-resolution-timed-out
        Namespace: AWS/States
        MetricName: ExecutionsTimedOut
        Dimensions:
          - Name: StateMachineArn
            Value:
              Ref: ResolutionStateMachine
        Statistic: Sum
        Period: 300
        EvaluationPeriods: 1
        Threshold: 1
        ComparisonOperator: GreaterThanOrEqualToThreshold
        TreatMissingData: notBreaching
        AlarmActions:
          - Ref: AlertTopic
    ResolverErrorsAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: hunch-${sls:stage}-resolver-errors
        Namespace: AWS/Lambda
        MetricName: Errors
        Dimensions:
          - Name: FunctionName
            Value: hunch-${sls:stage}-resolvePrediction
        Statistic: Sum
        Period: 300
        EvaluationPeriods: 1
        Threshold: 1
        ComparisonOperator: GreaterThanOrEqualToThreshold
        TreatMissingData: notBreaching
        AlarmActions:
          - Ref: AlertTopic
    RecoveryErrorsAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: hunch-${sls:stage}-recovery-errors
        Namespace: AWS/Lambda
        MetricName: Errors
        Dimensions:
          - Name: FunctionName
            Value: hunch-${sls:stage}-recoverStuckPredictions
        Statistic: Sum
        Period: 300
        EvaluationPeriods: 1
        Threshold: 1
        ComparisonOperator: GreaterThanOrEqualToThreshold
        TreatMissingData: notBreaching
        AlarmActions:
          - Ref: AlertTopic
