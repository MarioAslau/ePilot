service: hunch

frameworkVersion: "^4"

# Keep serverless-esbuild. Serverless 4's built-in esbuild conflicts with that plugin.
build:
  esbuild: false

provider:
  name: aws
  runtime: nodejs20.x
  # Region and stage confirmed during T04 manual preparation.
  # This project account is locked to Stockholm. See D6 in docs/architecture.md.
  # Use: serverless deploy --stage dev --region eu-north-1
  region: ${opt:region, 'eu-north-1'}
  stage: ${opt:stage, 'dev'}
  memorySize: 256
  timeout: 10
  logRetentionInDays: 14
  tags:
    project: hunch
    stage: ${self:provider.stage}
  # Health has no DynamoDB statements. Serverless still grants CloudWatch logs.
  # Player functions use PlayerLambdaRole. Passing amplifyOrigin on every deploy
  # keeps the hosted site allowed. Omitting it falls back to localhost.
  environment:
    TABLE_NAME: hunch-${sls:stage}
  httpApi:
    cors:
      allowedOrigins:
        - http://localhost:5173
        - ${param:amplifyOrigin, 'http://localhost:5173'}
      allowedHeaders:
        - Content-Type
        - Authorization
      allowedMethods:
        - GET
        - POST
      maxAge: 600

plugins:
  - serverless-esbuild

custom:
  esbuild:
    bundle: true
    minify: false
    sourcemap: true
    target: node20
    platform: node
    exclude:
      - '@aws-sdk/*'

functions:
  health:
    handler: src/handlers/health.handler
    description: Basic connectivity check
    events:
      - httpApi:
          path: /health
          method: GET
  createPlayer:
    handler: src/handlers/createPlayer.handler
    description: Create an anonymous player and return the raw token once
    role:
      Fn::GetAtt: [PlayerLambdaRole, Arn]
    events:
      - httpApi:
          path: /players
          method: POST
  me:
    handler: src/handlers/me.handler
    description: Restore the authenticated player's score
    role:
      Fn::GetAtt: [PlayerLambdaRole, Arn]
    events:
      - httpApi:
          path: /me
          method: GET
  market:
    handler: src/handlers/market.handler
    description: Public display quote for BTC-USD
    events:
      - httpApi:
          path: /market
          method: GET
  createPrediction:
    handler: src/handlers/createPrediction.handler
    description: Record one pending prediction for the authenticated player
    role:
      Fn::GetAtt: [PredictionLambdaRole, Arn]
    events:
      - httpApi:
          path: /predictions
          method: POST

resources:
  Resources:
    GameTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Retain
      Properties:
        TableName: hunch-${sls:stage}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: pk
            AttributeType: S
          - AttributeName: sk
            AttributeType: S
        KeySchema:
          - AttributeName: pk
            KeyType: HASH
          - AttributeName: sk
            KeyType: RANGE
        TimeToLiveSpecification:
          AttributeName: expiresAt
          Enabled: true
        Tags:
          - Key: project
            Value: hunch
          - Key: stage
            Value: ${sls:stage}
    PlayerLambdaRole:
      Type: AWS::IAM::Role
      Properties:
        RoleName: hunch-${sls:stage}-players
        AssumeRolePolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal:
                Service: lambda.amazonaws.com
              Action: sts:AssumeRole
        Policies:
          - PolicyName: player-table
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - dynamodb:GetItem
                    - dynamodb:PutItem
                  Resource:
                    Fn::GetAtt: [GameTable, Arn]
                - Effect: Allow
                  Action:
                    - logs:CreateLogStream
                    - logs:CreateLogGroup
                    - logs:TagResource
                  Resource:
                    Fn::Sub: arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/hunch-${sls:stage}-*:*
                - Effect: Allow
                  Action:
                    - logs:PutLogEvents
                  Resource:
                    Fn::Sub: arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/hunch-${sls:stage}-*:*:*
    PredictionLambdaRole:
      Type: AWS::IAM::Role
      Properties:
        RoleName: hunch-${sls:stage}-predictions
        AssumeRolePolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal:
                Service: lambda.amazonaws.com
              Action: sts:AssumeRole
        Policies:
          - PolicyName: prediction-table
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - dynamodb:GetItem
                    - dynamodb:PutItem
                    - dynamodb:UpdateItem
                    - dynamodb:TransactWriteItems
                  Resource:
                    Fn::GetAtt: [GameTable, Arn]
                - Effect: Allow
                  Action:
                    - logs:CreateLogStream
                    - logs:CreateLogGroup
                    - logs:TagResource
                  Resource:
                    Fn::Sub: arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/hunch-${sls:stage}-*:*
                - Effect: Allow
                  Action:
                    - logs:PutLogEvents
                  Resource:
                    Fn::Sub: arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/hunch-${sls:stage}-*:*:*
