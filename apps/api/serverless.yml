service: hunch

frameworkVersion: "^4"

provider:
  name: aws
  runtime: nodejs20.x
  # Region and stage confirmed during T04 manual preparation.
  # Use: serverless deploy --stage dev --region eu-west-1
  region: ${opt:region, 'eu-west-1'}
  stage: ${opt:stage, 'dev'}
  memorySize: 256
  timeout: 10
  logRetentionInDays: 14
  tags:
    project: hunch
    stage: ${self:provider.stage}

plugins:
  - serverless-esbuild

custom:
  esbuild:
    bundle: true
    minify: false
    sourcemap: true
    target: node20
    platform: node
    exclude:
      - '@aws-sdk/*'

functions:
  health:
    handler: src/handlers/health.handler
    description: Basic connectivity check
    events:
      - httpApi:
          path: /health
          method: GET
